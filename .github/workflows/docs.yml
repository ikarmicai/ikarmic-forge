name: Docs

# Builds the documentation site (a static rendering of README + docs/) and, on a release tag or
# manual run, publishes it to GitHub Pages. Enable Pages (Settings -> Pages -> Source: GitHub Actions)
# once before the first publish.

on:
  pull_request:
    paths: ['README.md', 'CHANGELOG.md', 'docs/**', 'scripts/build-docs.mjs']
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      # This repository has no lockfile.
      - run: pnpm install --no-frozen-lockfile
      - run: node scripts/build-docs.mjs --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
